name: OpenClaw Tarball Release

on:
  push:
    branches:
      - release/webhook-session-fix
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to publish
        required: true
        default: release/webhook-session-fix
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.33.0"
  npm_config_cache: /tmp/npm-cache

jobs:
  build_tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "true"

      - name: Rewrite prerelease version
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const baseVersion = pkg.version;
          const runNumber = process.env.GITHUB_RUN_NUMBER;
          const runAttempt = process.env.GITHUB_RUN_ATTEMPT;
          pkg.version = `${baseVersion}-webhookfix.${runNumber}.${runAttempt}`;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Show release version
        run: node -p "require('./package.json').name + '@' + require('./package.json').version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression tests
        run: pnpm test src/cron/isolated-agent/run.skill-filter.test.ts src/cron/isolated-agent/session.test.ts

      - name: Build runtime assets
        run: pnpm build

      - name: Build Control UI
        run: pnpm ui:build

      - name: Verify bundled runtime smoke
        run: node scripts/test-built-bundled-channel-entry-smoke.mjs

      - name: Verify plugin manifests exist
        run: |
          test -f dist/extensions/acpx/openclaw.plugin.json
          test -f dist/extensions/active-memory/openclaw.plugin.json

      - name: Write dist inventory
        run: node --import tsx scripts/write-package-dist-inventory.ts

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          PACK_JSON="$(npm pack --json --ignore-scripts)"
          printf '%s\n' "$PACK_JSON"
          PACK_FILE="$(printf '%s' "$PACK_JSON" | node -e 'const fs=require("node:fs"); const input=fs.readFileSync(0,"utf8"); const parsed=JSON.parse(input); process.stdout.write(parsed[0].filename);')"
          echo "file=${PACK_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-tarball
          path: ./${{ steps.pack.outputs.file }}
          if-no-files-found: error
